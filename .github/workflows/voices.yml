name: Record voices (ElevenLabs)

# Run from GitHub: Actions → "Record voices" → Run workflow.
# Needs one repository secret: ELEVENLABS_API_KEY (Settings → Secrets and variables → Actions)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only record this many new lines (e.g. 20 for a cheap sample). Leave empty for all.'
        required: false
        default: ''
      redo:
        description: 'Codes of lines to re-record, comma-separated (from the grown-up corner list, e.g. es/1a2b3c4d)'
        required: false
        default: ''
      names:
        description: 'Optional: names to record in praise ("¡Muy bien, ___!"). These recordings will be public.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y ffmpeg >/dev/null || true
      - run: npm run phrases
      - name: Record new lines
        run: npm run voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # the chosen voices (not secret); a VOICE_ID_EN / VOICE_ID_ES secret overrides them
          VOICE_ID_EN: ${{ secrets.VOICE_ID_EN || 'WyxfC66zZ4F16RqcMMHI' }}
          VOICE_ID_ES: ${{ secrets.VOICE_ID_ES || 'IdhxxSTaAg80CTeSgScm' }}
          LIMIT: ${{ inputs.limit }}
          REDO: ${{ inputs.redo }}
          NAMES: ${{ inputs.names }}
      - name: Save recordings to the repo
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add voices/phrases.json public/voices
          git diff --cached --quiet || git commit -m "Record voices"
          git push

  deploy:
    needs: record
    uses: ./.github/workflows/deploy.yml
