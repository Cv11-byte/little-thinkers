name: Record voices (ElevenLabs)

# Run from GitHub: Actions → "Record voices" → Run workflow,
# or by pushing a change to voices/request.json ({"limit": 20, "redo": "", "names": ""}).
# Needs one repository secret: ELEVENLABS_API_KEY (Settings → Secrets and variables → Actions)
on:
  push:
    branches: [main]
    paths: ['voices/request.json']
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only record this many new lines (e.g. 20 for a cheap sample). Leave empty for all.'
        required: false
        default: ''
      redo:
        description: 'Codes of lines to re-record, comma-separated (from the grown-up corner list, e.g. es/1a2b3c4d)'
        required: false
        default: ''
      names:
        description: 'Optional: names to record in praise ("¡Muy bien, ___!"). These recordings will be public.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y ffmpeg >/dev/null || true
      - run: npm run phrases
      - name: Read options
        id: opts
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f voices/request.json ]; then
            echo "limit=$(node -p "require('./voices/request.json').limit ?? ''")" >> "$GITHUB_OUTPUT"
            echo "redo=$(node -p "require('./voices/request.json').redo ?? ''")" >> "$GITHUB_OUTPUT"
            echo "names=$(node -p "require('./voices/request.json').names ?? ''")" >> "$GITHUB_OUTPUT"
            echo "maxchars=$(node -p "require('./voices/request.json').maxChars ?? ''")" >> "$GITHUB_OUTPUT"
          else
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
            echo "redo=${{ inputs.redo }}" >> "$GITHUB_OUTPUT"
            echo "names=${{ inputs.names }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Record new lines
        run: npm run voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # the chosen voices (not secret); a VOICE_ID_EN / VOICE_ID_ES secret overrides them
          VOICE_ID_EN: ${{ secrets.VOICE_ID_EN || 'yj30vwTGJxSHezdAGsv9' }}
          VOICE_ID_ES: ${{ secrets.VOICE_ID_ES || 'zl1Ut8dvwcVSuQSB9XkG' }}
          LIMIT: ${{ steps.opts.outputs.limit }}
          REDO: ${{ steps.opts.outputs.redo }}
          NAMES: ${{ steps.opts.outputs.names }}
          MAX_CHARS: ${{ steps.opts.outputs.maxchars }}
      - name: Save recordings to the repo
        if: always()
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add voices/phrases.json public/voices
          git diff --cached --quiet || git commit -m "Record voices"
          git pull --rebase origin main
          git push

  deploy:
    needs: record
    uses: ./.github/workflows/deploy.yml
